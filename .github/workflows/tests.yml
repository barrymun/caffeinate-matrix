name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Pinned so a new Ruff release can't start failing the build on its own.
      - run: pip install ruff==0.17.3

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check --diff .

  test:
    # The end-to-end tests drive the real caffeinate, so they need macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test with the macOS system Python
        run: /usr/bin/python3 --version && /usr/bin/python3 -m unittest discover -s tests -v

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test with the latest Python
        run: python --version && python -m unittest discover -s tests -v
